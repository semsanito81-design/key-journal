<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Журнал ключевых носителей</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
<style>
:root{
  --bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;
  --accent:#2563eb;--accent-2:#1d4ed8;--danger:#dc2626;--ok:#16a34a;
  --warn:#d97706;--sidebar:#0f172a;--sidebar-text:#cbd5e1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 system-ui,Segoe UI,Roboto,Arial,sans-serif;
     background:var(--bg);color:var(--text)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.hidden{display:none!important}

/* LOGIN */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#1e3a8a,#0f172a)}
.login-card{background:#fff;padding:32px;border-radius:16px;width:360px;
  box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-card h1{margin:0 0 4px;font-size:20px}
.login-card p{margin:0 0 20px;color:var(--muted);font-size:13px}
.login-card label{display:block;margin-bottom:12px;font-size:12px;color:var(--muted)}
.login-card input{width:100%;padding:10px 12px;border:1px solid var(--line);
  border-radius:8px;margin-top:4px}
.login-err{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:8px}

/* LAYOUT */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.sidebar{background:var(--sidebar);color:var(--sidebar-text);padding:16px 0;
  display:flex;flex-direction:column}
.brand{padding:0 20px 16px;font-weight:700;color:#fff;font-size:15px;
  border-bottom:1px solid #1e293b;margin-bottom:10px}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav a{padding:9px 12px;border-radius:8px;color:var(--sidebar-text);
  text-decoration:none;font-size:13px;display:flex;gap:8px;align-items:center}
.nav a:hover{background:#1e293b;color:#fff}
.nav a.active{background:var(--accent);color:#fff}
.nav-sep{margin:10px 0;border-top:1px solid #1e293b}
.user-box{margin-top:auto;padding:12px 20px;border-top:1px solid #1e293b;
  font-size:12px}
.user-box b{color:#fff;display:block;margin-bottom:2px}
.user-box .role{color:#94a3b8;text-transform:uppercase;font-size:10px;
  letter-spacing:.5px}
.user-box button{margin-top:8px;width:100%;background:#1e293b;color:#fff;
  border:0;padding:7px;border-radius:6px;font-size:12px}
.user-box button:hover{background:#334155}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--card);border-bottom:1px solid var(--line);
  padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.topbar h2{margin:0;font-size:16px;flex:1 1 auto}
.content{padding:16px 20px;overflow:auto;flex:1}

/* BUTTONS */
.btn{border:1px solid var(--line);background:#fff;color:var(--text);
  padding:7px 12px;border-radius:8px;font-size:13px;display:inline-flex;
  gap:6px;align-items:center;transition:.15s;white-space:nowrap}
.btn:hover{background:#eef2ff;border-color:#c7d2fe}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--danger);border-color:#fecaca}
.btn.danger:hover{background:#fef2f2}
.btn.sm{padding:4px 8px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* TABLE */
.table-wrap{background:var(--card);border-radius:12px;overflow:auto;
  border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;
  vertical-align:top;}
th{background:#f8fafc;font-weight:600;font-size:12px;color:var(--muted);
  position:sticky;top:0;cursor:pointer;user-select:none;z-index:2}
th:hover{background:#eef2ff}
th.sorted::after{content:" ▲";font-size:10px}
th.sorted.desc::after{content:" ▼"}
tr:hover td{background:#fafbff}
td.num{font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;
  font-size:11px;font-weight:600}
.badge.active{background:#dcfce7;color:#166534}
.badge.returned{background:#e0e7ff;color:#3730a3}
.badge.expired{background:#fee2e2;color:#991b1b}
.badge.reserved{background:#fef3c7;color:#92400e}
.badge.revoked{background:#fce7f3;color:#9d174d}
.exp-red{color:var(--danger);font-weight:600}
.exp-warn{color:var(--warn);font-weight:600}
.empty{padding:40px;text-align:center;color:var(--muted)}
/* Новые стили для гибкой таблицы и бейджей */
table { width: auto; min-width: 100%; border-collapse: collapse; }
th, td { padding: 8px 12px; vertical-align: middle; white-space: nowrap; }
td.wrap-text { white-space: normal; min-width: 250px; } /* Чтобы сертификаты переносились на новую строку, если не влезают */

/* TOOLBAR */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid var(--line);
  border-radius:8px;font-size:13px;min-width:140px}
.toolbar .spacer{flex:1}
.toolbar .chk{display:flex;align-items:center;gap:6px;font-size:13px;
  padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;
  cursor:pointer;user-select:none}
.toolbar .chk input{width:auto;min-width:0}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px}
.card .label{font-size:12px;color:var(--muted)}
.card .value{font-size:26px;font-weight:700;margin-top:4px}
.card .sub{font-size:11px;color:var(--muted);margin-top:4px}
.card.warn .value{color:var(--warn)}
.card.danger .value{color:var(--danger)}
.card.ok .value{color:var(--ok)}

/* MODAL */
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);
  display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.backdrop.open{display:flex}
.modal{background:#fff;border-radius:14px;width:min(820px,100%);
  max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);
  display:flex;flex-direction:column}
.modal h2{margin:0;padding:16px 20px;border-bottom:1px solid var(--line);
  font-size:16px}
.form{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;
  color:var(--muted)}
.form label.full{grid-column:1/-1}
.form label.check{flex-direction:row;align-items:center;gap:8px;
  font-size:13px;color:var(--text)}
.form input,.form select,.form textarea{padding:8px 10px;border:1px solid var(--line);
  border-radius:8px;background:#fff}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid #bfdbfe;
  border-color:var(--accent)}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);
  display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;
  background:#fff}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:#111827;color:#fff;
  padding:10px 16px;border-radius:10px;opacity:0;transform:translateY(10px);
  transition:.25s;z-index:100;font-size:13px;max-width:340px}
.toast.show{opacity:1;transform:none}
.toast.error{background:var(--danger)}
.toast.ok{background:var(--ok)}

/* LOG */
.log-item{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;
  display:grid;grid-template-columns:170px 140px 1fr;gap:10px}
.log-item .time{color:var(--muted);font-size:12px}
.log-item .who{font-weight:600}
.log-item details{margin-top:4px;grid-column:1/-1;font-size:12px;color:var(--muted)}
.log-item pre{background:#f8fafc;padding:6px;border-radius:6px;
  overflow:auto;font-size:11px;margin:4px 0 0}

/* PRINT */
@media print {
  @page { size: A4 landscape; margin: 10mm; } /* Горизонтальная ориентация и отступы 1 см */
  body { background: #fff; font-size: 12px; color: #000; }
  #app, .topbar, .toolbar, .sidebar, .backdrop, .toast, .content { display: none !important; }
  
  #printArea { display: block !important; width: 100%; padding: 0; }
  .act { font-family: 'Times New Roman', serif; color: #000; }
  .act h1 { font-size: 18px; text-align: center; margin: 0 0 15px; text-transform: uppercase; }
  .act p { margin: 5px 0; }
  
  /* Таблица носителя */
  .act table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 12px; }
  .act th, .act td { border: 1px solid #000; padding: 4px 8px; text-align: left; }
  
  /* Убираем бейджи и делаем статус текстом */
  .act .badge { border: none; padding: 0; font-weight: normal; background: none !important; color: #000 !important; font-size: 12px; }
  .act .exp-red { color: #000 !important; font-weight: bold; }
  
  /* Подписи */
  .act .sign { margin-top: 30px; display: flex; justify-content: space-between; gap: 40px; page-break-inside: avoid; }
  .act .sign div { width: 45%; border-top: 1px solid #000; padding-top: 5px; text-align: center; font-size: 12px; }
}
#printArea { display: none; }

@media(max-width:900px){
  #app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-230px;top:0;bottom:0;width:230px;z-index:60;
    transition:left .2s}
  .sidebar.open{left:0}
  .form{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="loginScreen">
  <form class="login-card" id="loginForm">
    <h1>🔑 Журнал ключевых носителей</h1>
    <p>Вход в систему</p>
    <div class="login-err" id="loginErr"></div>
    <label>Логин<input id="li_login" required autocomplete="username" value="admin"></label>
    <label>Пароль<input id="li_pass" type="password" required autocomplete="current-password" value="admin123"></label>
    <button class="btn primary" style="width:100%;justify-content:center;padding:10px"
      type="submit">Войти</button>
  </form>
</div>

<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand">🔑 Журнал носителей</div>
    <nav class="nav">
      <a href="#dashboard" data-view="dashboard">📊 Дашборд</a>
      <a href="#journal" data-view="journal">📋 Журнал</a>      
      <a href="#employees" data-view="employees">👤 Сотрудники</a>
      <a href="#types" data-view="types" data-role="admin">🏷 Типы сертификатов</a>
      <a href="#users" data-view="users" data-role="admin">👥 Пользователи</a>
      <a href="#audit" data-view="audit" data-role="admin,auditor">📜 Аудит-лог</a>
      <div class="nav-sep"></div>
      <a href="#profile" data-view="profile">👤 Профиль</a>
    </nav>
    <div class="user-box">
      <b id="ub_name">—</b>
      <span class="role" id="ub_role">—</span>
      <button id="btnLogout">Выйти</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="btn sm" id="btnMenu" style="display:none">☰</button>
      <h2 id="viewTitle">Журнал</h2>
      <span id="topbarActions"></span>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="backdrop" id="backdrop">
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <footer id="modalFooter"></footer>
  </div>
</div>

<div id="printArea"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   API
   ============================================================ */
const API = {
  async req(method,url,body){
    const r = await fetch(url,{
      method,
      headers: body ? {'Content-Type':'application/json'} : {},
      credentials:'include',
      body: body ? JSON.stringify(body) : undefined
    });
    if(r.status===401){ session=null; showLogin(); throw new Error('Не авторизован'); }
    if(!r.ok){
      let msg = r.statusText;
      try{ msg = (await r.json()).error || msg; }catch{}
      throw new Error(msg);
    }
    if(r.status===204) return null;
    return r.json();
  },
  login:(login,password)=>API.req('POST','/api/auth/login',{login,password}),
  logout:()=>API.req('POST','/api/auth/logout'),
  me:()=>API.req('GET','/api/auth/me'),
  changePassword:(oldPassword,newPassword)=>
    API.req('POST','/api/auth/change-password',{oldPassword,newPassword}),

  carriers:(f={})=>API.req('GET','/api/carriers?with=certificates&'+new URLSearchParams(
    Object.fromEntries(Object.entries(f).filter(([,v])=>v!=null && v!=='')))),
  addCarrier:c=>API.req('POST','/api/carriers',c),
  updCarrier:(id,c)=>API.req('PATCH','/api/carriers/'+id,c),
  delCarrier:id=>API.req('DELETE','/api/carriers/'+id),

  certTypes:()=>API.req('GET','/api/certificates/types'),
  addCertType:(t)=>API.req('POST','/api/certificates/types',t),
  updCertType:(c,t)=>API.req('PATCH','/api/certificates/types/'+c,t),
  delCertType:(c)=>API.req('DELETE','/api/certificates/types/'+c),

  certs:(f={})=>API.req('GET','/api/certificates?'+new URLSearchParams(f)),
  addCert:c=>API.req('POST','/api/certificates',c),
  updCert:(id,c)=>API.req('PATCH','/api/certificates/'+id,c),
  delCert:id=>API.req('DELETE','/api/certificates/'+id),

  employees:()=>API.req('GET','/api/employees'),
  addEmployee:(e)=>API.req('POST','/api/employees',e),
  updEmployee:(id,e)=>API.req('PATCH','/api/employees/'+id,e),
  delEmployee:(id)=>API.req('DELETE','/api/employees/'+id),

  users:()=>API.req('GET','/api/users'),
  addUser:u=>API.req('POST','/api/users',u),
  updUser:(id,u)=>API.req('PATCH','/api/users/'+id,u),
  delUser:id=>API.req('DELETE','/api/users/'+id),

  audit:(limit=500)=>API.req('GET','/api/audit?limit='+limit),
};

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY = 86400000;
const fmtDate = s => { if(!s) return '—'; const d=new Date(s);
  return isNaN(d)?esc(s):d.toLocaleDateString('ru-RU'); };
const todayISO = ()=> new Date().toISOString().slice(0,10);

function daysBetween(to){ if(!to) return null; return Math.ceil((new Date(to)-new Date())/DAY); }
function daysLeftOfCert(c){ if(!c || !c.validTo) return null; return daysBetween(c.validTo); }
function statusOfCert(c){
  if(!c) return 'active'; if(c.status==='revoked') return 'revoked'; if(c.status==='reserved') return 'reserved';
  const dl = daysLeftOfCert(c); if(dl!==null && dl<0) return 'expired'; return 'active';
}
function badgeOf(st){
  return {
    active:   '<span class="badge active">Активен</span>',
    returned: '<span class="badge returned">Возвращён</span>',
    expired:  '<span class="badge expired">Истёк</span>',
    reserved: '<span class="badge reserved">Резерв</span>',
    revoked:  '<span class="badge revoked">Отозван</span>',
  }[st] || '';
}

let toastTimer;
function toast(msg,type=''){
  const t=$('#toast'); t.textContent=msg; t.className='toast show '+type;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }

function normCarrier(r){
  return {
    id: r.id, ppp: r.ppp,
    issueDate: r.issue_date ? r.issue_date.slice(0,10) : '',
    carrierType: r.carrier_type,
    carrierSerial: r.carrier_serial,
    employee: r.employee,
    position: r.position,
    department: r.department,
    status: r.status,
    signCert: r.sign_cert,
    signCarrier: r.sign_carrier,
    twoFactor: r.two_factor,
    returnMark: r.return_mark ? r.return_mark.slice(0,10) : '',
    certificates: (r.certificates||[]).map(normCert),
  };
}
function normCert(c){
  return {
    id: c.id, carrierId: c.carrier_id,
    certType: c.cert_type,
    typeName: c.type_name,
    typeTitle: c.type_title,
    serialNumber: c.serial_number,
    validFrom: c.valid_from ? c.valid_from.slice(0,10) : '',
    validTo: c.valid_to ? c.valid_to.slice(0,10) : '',
    status: c.status,
    note: c.note,
  };
}
function normUser(u){
  return { id:u.id, login:u.login, fullName:u.full_name, role:u.role,
           active:u.active, created:u.created, lastLogin:u.last_login };
}

let session = null;
async function tryAutoLogin(){
  try{
    const u = await API.me();
    session = { id:u.id, login:u.login, role:u.role, fullName:u.fullName };
    return true;
  }catch{ return false; }
}
function showLogin(){ $('#loginScreen').classList.remove('hidden'); $('#app').classList.add('hidden'); }
function showApp(){ $('#loginScreen').classList.add('hidden'); $('#app').classList.remove('hidden'); }
function can(roles){ return session && roles.split(',').includes(session.role); }

$('#loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const err=$('#loginErr'); err.textContent='';
  try{
    const { user } = await API.login($('#li_login').value.trim(), $('#li_pass').value);
    session = { id:user.id, login:user.login, role:user.role, fullName:user.fullName };
    showApp(); bootApp();
  }catch(ex){ err.textContent = ex.message; }
});
$('#btnLogout').onclick = async ()=>{ try{ await API.logout(); }catch{} session=null; showLogin(); };
$('#btnMenu').onclick = ()=> $('#sidebar').classList.toggle('open');

let currentView = 'journal';
let certTypes = [];

function bootApp(){
  $('#ub_name').textContent = session.fullName;
  $('#ub_role').textContent = session.role;
  $$('.nav a[data-role]').forEach(a=>a.classList.toggle('hidden', !can(a.dataset.role)));
  if(window.innerWidth<=900) $('#btnMenu').style.display='inline-flex';
  window.removeEventListener('hashchange', route);
  window.addEventListener('hashchange', route);
  API.certTypes().then(t=>{ certTypes = t; }).catch(()=>{});
  route();
}

async function route(){
  const h = location.hash.replace('#','') || 'journal';
  const allowed = {
    dashboard:()=>true, journal:()=>true, employees:()=>true, profile:()=>true,
    types:()=>can('admin'), users:()=>can('admin'), audit:()=>can('admin,auditor')
  };
  if(!allowed[h] || !allowed[h]()){ location.hash='journal'; return; }
  currentView = h;
  $$('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.view===h));
  const titles = {dashboard:'Дашборд',journal:'Журнал',employees:'Сотрудники',types:'Типы сертификатов',
                  users:'Пользователи',audit:'Аудит-лог',profile:'Профиль'};
  $('#viewTitle').textContent = titles[h]||'';
  await renderTopbarActions();
  try{
    if(h==='dashboard') await renderDashboard();
    if(h==='journal')   await renderJournal();
    if(h==='employees') await renderEmployees();    
    if(h==='types')     await renderTypes();
    if(h==='users')     await renderUsers();
    if(h==='audit')     await renderAudit();
    if(h==='profile')   await renderProfile();
  }catch(ex){
    if(ex.message!=='Не авторизован') toast(ex.message,'error');
  }
}

async function renderTopbarActions(){
  const box = $('#topbarActions'); box.innerHTML='';
  if(currentView==='journal' && can('admin,operator')){
    box.innerHTML = `<button class="btn primary" id="tbAdd">➕ Носитель</button>
      <label class="btn" style="cursor:pointer">📥 Импорт Excel
        <input type="file" id="tbImport" accept=".xlsx,.xls" hidden></label>
      <button class="btn" id="tbExport">⬇️ Экспорт CSV</button>
      <button class="btn" id="tbPrint">🖨 Печать списка</button>`;
    $('#tbAdd').onclick = ()=>openCarrierModal(null);
    $('#tbImport').onchange = importExcel;
    $('#tbExport').onclick = exportCsv;
    $('#tbPrint').onclick = printJournal;
  }
  if(currentView==='users' && can('admin')){
    box.innerHTML = `<button class="btn primary" id="tbAddUser">➕ Пользователь</button>`;
    $('#tbAddUser').onclick = ()=>openUserModal(null);
  }
  if(currentView==='types' && can('admin')){
    box.innerHTML = `<button class="btn primary" id="tbAddType">➕ Тип</button>`;
    $('#tbAddType').onclick = ()=>openTypeModal(null);
  }
}

/* ============================================================
   ЖУРНАЛ (Сводный вид)
   ============================================================ */
let journalData = [];
let filters = { q:'', status:'' };
let sortKey = 'ppp', sortDesc = false;
let page = 1, pageSize = 50;

const SORT_ACCESSORS = {
  ppp:           r => r.ppp ?? 0,
  carrierType:   r => r.carrierType || '',
  carrierSerial: r => r.carrierSerial || '',
  employee:      r => r.employee || '',
};

function getSorted(rows){
  const get = SORT_ACCESSORS[sortKey] || (r => r[sortKey]);
  const arr = [...rows];
  arr.sort((a,b)=>{
    let va = get(a), vb = get(b);
    if(va==null) va=''; if(vb==null) vb='';
    if(typeof va==='number' && typeof vb==='number') return sortDesc?vb-va:va-vb;
    return sortDesc
      ? String(vb).localeCompare(String(va),'ru',{numeric:true})
      : String(va).localeCompare(String(vb),'ru',{numeric:true});
  });
  return arr;
}

function head(key,label){
  const sorted = sortKey===key;
  return `<th data-key="${key}" class="${sorted?'sorted'+(sortDesc?' desc':''):''}">${label}</th>`;
}

function drawJournalTable(){
  let base = [...journalData];
  if(filters.status){
    base = base.filter(r => {
      if(!r.certificates?.length) return filters.status === 'active';
      return r.certificates.some(c => statusOfCert(c) === filters.status);
    });
  }

  const sorted = getSorted(base);
  const total = sorted.length;
  const pages = Math.max(1, Math.ceil(total/pageSize));
  if(page>pages) page=pages;
  const slice = sorted.slice((page-1)*pageSize, page*pageSize);

  const tb = $('#tbody');
  if(!slice.length){
    tb.innerHTML = `<tr><td colspan="6" class="empty">Нет записей</td></tr>`;
  }else{
    tb.innerHTML = slice.map(r=>{
      // Рендер сертификатов в столбик
      let certsHtml = '';
      let statusHtml = '';
      
      if(!r.certificates || r.certificates.length === 0) {
        certsHtml = '<span style="color:var(--muted)">Нет сертификатов</span>';
        statusHtml = '—';
      } else {
        certsHtml = r.certificates.map(c => {
          const type = c.typeName || c.certType;
          return `<div style="font-size: 12px; margin-bottom: 4px;">
            <b>${type}</b>: ${fmtDate(c.validFrom)} — ${fmtDate(c.validTo)}
          </div>`;
        }).join('');

        statusHtml = r.certificates.map(c => {
          const dl = daysLeftOfCert(c);
          if (dl === null) return '<div style="font-size: 12px; margin-bottom: 4px;">—</div>';
          
          const isExp = dl < 0;
          const isWarn = dl >= 0 && dl < 60;
          const cls = isExp ? 'badge expired' : (isWarn ? 'badge reserved' : 'badge active');
          const text = isExp ? `Истёк (-${-dl} дн.)` : `Осталось ${dl} дн.`;
          
          return `<div style="margin-bottom: 4px;"><span class="${cls}" style="font-size:11px;">${text}</span></div>`;
        }).join('');
      }

      return `<tr>
        <td class="num">${r.ppp ?? ''}</td>
        <td>${esc(r.carrierType)}</td>
        <td class="num"><b>${esc(r.carrierSerial)}</b></td>
        <td>
          <b>${esc(r.employee)}</b><br>
          <span style="font-size:11px; color:var(--muted)">${esc(r.position||'')} ${r.department?'· '+esc(r.department):''}</span>
        </td>
        <td class="wrap-text">${certsHtml}</td>
        <td>${statusHtml}</td>
        <td style="text-align: right;">
          ${can('admin,operator') ? `
            <div style="display: flex; gap: 4px; justify-content: flex-end;">
              <button class="btn sm" data-act="addCert" data-id="${r.id}" title="Добавить серт.">➕</button>
              <button class="btn sm" data-act="editCarrier" data-id="${r.id}" title="Ред. носитель">📝</button>
              <button class="btn sm" data-act="printAct" data-id="${r.id}" title="Акт">🖨</button>
              <button class="btn sm danger" data-act="delCarrier" data-id="${r.id}" title="Удалить носитель">🗑</button>
            </div>
          `:''}
        </td>
      </tr>`;
    }).join('');
  }
  
  $('#fl_stat').textContent = `Записей: ${total}`;
  $('#pager').innerHTML = total<=pageSize ? '' : `
    <button class="btn sm" ${page===1?'disabled':''} id="pgPrev">← Назад</button>
    <span style="color:var(--muted)">Стр. ${page} из ${pages}</span>
    <button class="btn sm" ${page===pages?'disabled':''} id="pgNext">Вперёд →</button>
    <select id="pgSize" style="margin-left:auto">
      ${[10,25,50,100,200].map(n=>`<option ${n===pageSize?'selected':''}>${n}</option>`).join('')}
    </select>`;
  if($('#pgPrev')) $('#pgPrev').onclick = ()=>{page--; drawJournalTable();};
  if($('#pgNext')) $('#pgNext').onclick = ()=>{page++; drawJournalTable();};
  if($('#pgSize')) $('#pgSize').onchange = e=>{pageSize=+e.target.value; page=1; drawJournalTable();};

  tb.onclick = handleTableClick;
}

async function handleTableClick(e){
  const b = e.target.closest('button[data-act]'); if(!b) return;
  const id = b.dataset.id, act = b.dataset.act;

  if(act==='editCarrier'){
    const r = journalData.find(x=>x.id===id);
    return openCarrierModal(r);
  }
  if(act==='addCert') return openCertModal(id, null);
  if(act==='editCert'){
    for(const r of journalData){
      const c = r.certificates?.find(x=>x.id===id);
      if(c) return openCertModal(r.id, c);
    }
    return;
  }
  if(act==='delCert'){
    if(!confirm('Удалить сертификат?')) return;
    try{ await API.delCert(id); await loadAndDraw(); toast('Удалено','ok'); }
    catch(ex){ toast(ex.message,'error'); }
    return;
  }
  if(act==='delCarrier'){
    if(!confirm('Удалить носитель со всеми сертификатами?')) return;
    try{ await API.delCarrier(id); await loadAndDraw(); toast('Удалено','ok'); }
    catch(ex){ toast(ex.message,'error'); }
    return;
  }
  if(act==='printAct'){
    const r = journalData.find(x=>x.id===id);
    if(r) printAct(r);
  }
}

   ============================================================ */
async function importExcel(e){
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = async ev=>{
    try{
      const wb = XLSX.read(ev.target.result, {type:'array', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});

      const payload = [];
      for(const r of rows){
        const employee = String(r['ФИО, должность и подразделение сотрудника']||'').trim();
        if(!employee) continue;
        const parts = employee.split(',').map(s=>s.trim());
        const serial = String(r['Номер, серия ключевого носителя']||'').trim()
          .replace(/С/g,'C');
        payload.push({
          issueDate:    toISO(r['дата выдачи']),
          carrierType:  String(r['Вид ключевого носителя']||'').trim(),
          carrierSerial:serial,
          employee:     parts[0]||employee,
          position:     parts[1]||'',
          department:   parts[2]||'',
          certificates: [{
            certType: +(r['Вид сертификата *']||1),
            validFrom:toISO(r['Период действия сертификата']),
            serialNumber: String(r['Серийный номер сертификата']||'').trim(),
            status:       r['Отметка о возврате ключевого носителя']?'revoked':'active',
          }]
        });
      }

      if(!payload.length){ toast('Нет валидных строк','error'); return; }
      const { added } = await API.req('POST','/api/carriers/bulk', payload);
      toast(`Импортировано: ${added} из ${payload.length}`,'ok');
      await loadAndDraw();
    }catch(ex){ toast('Ошибка импорта: '+ex.message,'error'); }
    e.target.value='';
  };
  reader.readAsArrayBuffer(f);
}
function toISO(v){
  if(!v) return null;
  if(v instanceof Date) return v.toISOString().slice(0,10);
  const s = String(v).trim();
  const m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  const d = new Date(s); return isNaN(d)?null:d.toISOString().slice(0,10);
}

function exportCsv(){
  const rows = journalData;
  const head = ['№','Носитель','Серийный №','ФИО','Должность','Подразделение','Сертификаты'];
  const body = rows.map(r=>{
    const certs = (r.certificates||[]).map(c=>`${c.typeName}: ${c.validFrom} - ${c.validTo}`).join(' | ');
    return [r.ppp||'', r.carrierType||'', r.carrierSerial||'', r.employee||'', r.position||'', r.department||'', certs].map(v=>String(v).replace(/;/g,',')).join(';');
  });
  const csv = '\uFEFF'+[head.join(';'), ...body].join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `journal_${todayISO()}.csv`; a.click();
}

async function renderDashboard(){
  let certs, carriers;
  try{ certs = await API.certs(); carriers = await API.carriers(); }catch(ex){ toast(ex.message,'error'); return; }
  const byType = {};
  for(const c of certs){ const t = c.type_name || String(c.cert_type); byType[t] ||= {total:0,expiring30:0,expiring60:0,expiring90:0,expired:0}; byType[t].total++; if(c.valid_to){ const dl = daysBetween(c.valid_to.slice(0,10)); if(dl<0) byType[t].expired++; else { if(dl<=30) byType[t].expiring30++; if(dl<=60) byType[t].expiring60++; if(dl<=90) byType[t].expiring90++; } } }
  const totalExpired = Object.values(byType).reduce((s,x)=>s+x.expired,0);
  const total30 = Object.values(byType).reduce((s,x)=>s+x.expiring30,0);
  const expiringList = certs.filter(c=>{ if(!c.valid_to) return false; const dl = daysBetween(c.valid_to.slice(0,10)); return dl!=null && dl>=0 && dl<=90; }).sort((a,b)=> new Date(a.valid_to)-new Date(b.valid_to));
  
  $('#content').innerHTML = `
    <div class="cards">
      <div class="card"><div class="label">Носителей</div><div class="value">${carriers.length}</div></div>
      <div class="card"><div class="label">Сертификатов</div><div class="value">${certs.length}</div></div>
      <div class="card danger"><div class="label">Истекло</div><div class="value">${totalExpired}</div></div>
      <div class="card warn"><div class="label">Истекает ≤30 дн.</div><div class="value">${total30}</div></div>
    </div>
    <h3 style="margin:16px 0 8px">По типам сертификатов</h3>
    <div class="cards">
      ${Object.entries(byType).map(([t,s])=>`
        <div class="card ${s.expiring30?'warn':s.expired?'danger':''}">
          <div class="label">${esc(t)}</div>
          <div class="value">${s.total}</div>
          <div class="sub">≤30: ${s.expiring30} · ≤60: ${s.expiring60} · ≤90: ${s.expiring90}<br>истекло: ${s.expired}</div>
        </div>`).join('')}
    </div>
    <h3 style="margin:16px 0 8px">Истекают в ближайшие 90 дней (${expiringList.length})</h3>
    <div class="table-wrap"><table>
      <thead><tr><th>ФИО</th><th>Носитель</th><th>Тип</th><th>Серийник</th><th>Действует до</th><th>Осталось</th></tr></thead>
      <tbody>${expiringList.slice(0,100).map(c=>{
        const dl = daysBetween(c.valid_to.slice(0,10));
        return `<tr><td>${esc(c.employee||'')}</td><td>${esc(c.carrier_serial||'')}</td><td>${esc(c.type_name||'')}</td><td>${esc(c.serial_number||'')}</td><td>${fmtDate(c.valid_to)}</td><td class="${dl<60?'exp-warn':''}">${dl} дн.</td></tr>`;
      }).join('') || '<tr><td colspan="6" class="empty">Нет</td></tr>'}</tbody>
    </table></div>`;
}

async function renderUsers(){
  let users;
  try{ users = (await API.users()).map(normUser); }catch(ex){ toast(ex.message,'error'); return; }

    <div class="table-wrap"><table>
      <thead><tr><th>Логин</th><th>ФИО</th><th>Роль</th><th>Активен</th><th>Создан</th><th>Последний вход</th><th></th></tr></thead>

        <td><b>${esc(u.login)}</b></td><td>${esc(u.fullName)}</td><td>${esc(u.role)}</td><td>${u.active?'✅':'⛔'}</td>
        <td>${fmtDate(u.created)}</td><td>${u.lastLogin?new Date(u.lastLogin).toLocaleString('ru-RU'):'—'}</td>
        <td>
          <button class="btn sm" data-act="edit" data-id="${u.id}">✏️</button>

        </td></tr>`).join('')}</tbody>

  $('#content').onclick = async e=>{

    if(b.dataset.act==='edit') openUserModal(u);

async function renderEmployees(){
  let list;
  try { list = await API.employees(); } catch(ex) { toast(ex.message, 'error'); return; }
  
  $('#content').innerHTML = `
    <div class="toolbar">
      <input id="emp_q" placeholder="Поиск по ФИО...">
      <span class="spacer"></span>
      <button class="btn primary" id="btnAddEmp">➕ Добавить</button>
      <label class="btn" style="cursor:pointer; margin-left:8px;">📥 Импорт CSV
        <input type="file" id="importEmpFile" accept=".csv" hidden>
      </label>
      <button class="btn" id="btnExportEmp">⬇️ Экспорт CSV</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ФИО</th>
            <th>Должность</th>
            <th>Подразделение</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="emp_tbody">
          ${list.map(e => `
            <tr>
              <td><b>${esc(e.full_name)}</b></td>
              <td>${esc(e.position || '—')}</td>
              <td>${esc(e.department || '—')}</td>
              <td>
                <button class="btn sm" data-act="edit" data-id="${e.id}">✏️</button>
                <button class="btn sm danger" data-act="del" data-id="${e.id}">🗑</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;

  $('#emp_q').oninput = (e) => {
    const val = e.target.value.toLowerCase();
    $$('#emp_tbody tr').forEach(tr => {
      tr.style.display = tr.textContent.toLowerCase().includes(val) ? '' : 'none';
    });
  };

  $('#btnAddEmp').onclick = () => openEmployeeModal(null);
  
  $('#btnExportEmp').onclick = () => {
    // ЭКСПОРТ
    const head = ['ФИО;Должность;Подразделение'];
    const body = list.map(e => [e.full_name, e.position||'', e.department||''].map(v=>String(v).replace(/;/g,',')).join(';'));
    const csv = '\uFEFF' + [head, ...body].join('\n');
    const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `employees_${todayISO()}.csv`;
    a.click();
  };

  $('#importEmpFile').onchange = async (e) => {
    // ИМПОРТ
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = async ev => {
      try {
        const text = ev.target.result;
        const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
        const payload = [];
        
        // Пропускаем первую строку (заголовки), если она там есть
        let startIdx = 0;
        if(lines[0].toLowerCase().includes('фио')) startIdx = 1;
        
        for(let i = startIdx; i < lines.length; i++) {
          const parts = lines[i].split(';');
          if(parts.length >= 1 && parts[0]) {
            payload.push({
              full_name: parts[0].trim(),
              position: parts[1] ? parts[1].trim() : '',
              department: parts[2] ? parts[2].trim() : ''
            });
          }
        }
        
        if(!payload.length) throw new Error('Пустой файл или неверный формат');
        
        const res = await API.req('POST', '/api/employees/bulk', payload);
        toast(`Успешно загружено: ${res.added}`, 'ok');
        await renderEmployees();
      } catch(ex) { toast('Ошибка импорта: ' + ex.message, 'error'); }
      e.target.value = '';
    };
    reader.readAsText(f, 'UTF-8');
  };

  $('#emp_tbody').onclick = (e) => {
    const btn = e.target.closest('button[data-act]');
    if(!btn) return;
    const id = btn.dataset.id;
    const emp = list.find(x => x.id === id);
    if(btn.dataset.act === 'edit') openEmployeeModal(emp);
    if(btn.dataset.act === 'del') {
      if(confirm(`Удалить ${emp.full_name} из базы?`)) {
        API.delEmployee(id).then(() => renderEmployees());
      }
    }
  };
}
